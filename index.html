<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Aplicación de fidget digital para personas con TDAH. Pequeñas distracciones que te ayudan a mantenerte enfocado mientras escuchas podcasts o estudias.">
    <meta name="keywords" content="TDAH, fidget, neurodivergente, concentración, focus, ADHD, estimulación sensorial">
    <meta name="author" content="TDAH Fidget">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TDAH Fidget - Relaja tu mente">
    <meta property="og:description" content="Aplicación de fidget digital para personas con TDAH. Mantén tu mente ocupada mientras te concentras en lo importante.">
    <meta property="og:image" content="/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TDAH Fidget - Relaja tu mente">
    <meta name="twitter:description" content="Aplicación de fidget digital para personas con TDAH">

    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>TDAH Fidget - Relaja tu mente</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">

    <!-- Deploy version: 1.0 -->
</head>
<body>
    <!-- Pantalla de inicio -->
    <div id="home-screen" class="screen active">
        <div class="container">
            <h1>🧠 TDAH Fidget</h1>
            <p class="subtitle">Pequeñas distracciones para mantenerte enfocado</p>

            <div class="activities-grid">
                <button class="activity-card" data-activity="toggle">
                    <div class="activity-icon">🔘</div>
                    <h3>Interruptor</h3>
                    <p>Toggle switch con sonido suave</p>
                </button>

                <button class="activity-card" data-activity="drawing">
                    <div class="activity-icon">🎨</div>
                    <h3>Pizarra Zen</h3>
                    <p>Dibuja y observa cómo se borra</p>
                </button>

                <button class="activity-card" data-activity="bubbles">
                    <div class="activity-icon">🫧</div>
                    <h3>Burbujas</h3>
                    <p>Toca para explotar burbujas</p>
                </button>

                <button class="activity-card" data-activity="spinner">
                    <div class="activity-icon">⭕</div>
                    <h3>Spinner</h3>
                    <p>Gira y observa el movimiento</p>
                </button>
            </div>
        </div>
    </div>

    <!-- Actividad: Toggle Switch -->
    <div id="toggle-screen" class="screen">
        <button class="back-btn" onclick="goHome()">← Volver</button>
        <button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
        <button class="change-toggle-btn" onclick="changeToggleStyle()">🔄 Cambiar Modelo</button>
        <div class="activity-container">
            <h2>Interruptor Fidget</h2>
            <div class="toggle-wrapper">
                <!-- Modelo 1: Moderno (actual) -->
                <div class="toggle-modern toggle-model active" data-model="0">
                    <div class="toggle-switch" id="toggleSwitch0">
                        <div class="toggle-slider"></div>
                    </div>
                </div>

                <!-- Modelo 2: iOS Style -->
                <div class="toggle-ios toggle-model" data-model="1">
                    <div class="toggle-switch" id="toggleSwitch1">
                        <div class="toggle-slider"></div>
                    </div>
                </div>

                <!-- Modelo 3: Material Design -->
                <div class="toggle-material toggle-model" data-model="2">
                    <div class="toggle-switch" id="toggleSwitch2">
                        <div class="toggle-track"></div>
                        <div class="toggle-thumb"></div>
                    </div>
                </div>

                <!-- Modelo 4: 3D Skeuomorphic -->
                <div class="toggle-3d toggle-model" data-model="3">
                    <div class="toggle-switch" id="toggleSwitch3">
                        <div class="toggle-slider"></div>
                    </div>
                </div>

                <!-- Modelo 5: Con Texto ON/OFF -->
                <div class="toggle-text toggle-model" data-model="4">
                    <div class="toggle-switch" id="toggleSwitch4">
                        <span class="toggle-label-off">OFF</span>
                        <div class="toggle-slider"></div>
                        <span class="toggle-label-on">ON</span>
                    </div>
                </div>

                <!-- Modelo 6: Minimalista -->
                <div class="toggle-minimal toggle-model" data-model="5">
                    <div class="toggle-switch" id="toggleSwitch5">
                        <div class="toggle-slider"></div>
                    </div>
                </div>
            </div>
            <p class="hint">Toca para cambiar</p>
        </div>
    </div>

    <!-- Actividad: Pizarra de dibujo -->
    <div id="drawing-screen" class="screen">
        <button class="back-btn" onclick="goHome()">← Volver</button>
        <button class="sound-btn" onclick="toggleSound()">🔊</button>
        <div class="activity-container">
            <h2>Pizarra Zen</h2>
            <canvas id="drawingCanvas"></canvas>
            <div class="drawing-controls">
                <label>
                    <input type="range" id="brushSize" min="5" max="50" value="20">
                    <span>Tamaño</span>
                </label>
                <label>
                    <input type="range" id="fadeTime" min="1" max="10" value="3" step="1">
                    <span>Borrado: <span id="fadeTimeValue">3</span>s</span>
                </label>
                <button id="clearCanvas" class="control-btn">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Actividad: Burbujas -->
    <div id="bubbles-screen" class="screen">
        <button class="back-btn" onclick="goHome()">← Volver</button>
        <button class="sound-btn" onclick="toggleSound()">🔊</button>
        <button class="game-mode-btn" onclick="toggleGameMode()">🎮 Modo Juego</button>
        <div class="activity-container">
            <h2>Pop Bubbles</h2>

            <!-- Objetivo del modo juego -->
            <div id="gameObjective" class="game-objective" style="display: none;">
                <div class="objective-content">
                    <span>Explota</span>
                    <div id="targetColorDisplay" class="target-color-display"></div>
                    <span id="objectiveCounter" class="objective-counter">0/0</span>
                </div>
            </div>

            <div id="bubblesContainer"></div>
            <p class="hint">Toca las burbujas para explotarlas</p>
        </div>
    </div>

    <!-- Actividad: Spinner -->
    <div id="spinner-screen" class="screen">
        <button class="back-btn" onclick="goHome()">← Volver</button>
        <button class="sound-btn" onclick="toggleSound()">🔊</button>
        <div class="activity-container">
            <h2>Spinner</h2>
            <div class="spinner-wrapper">
                <svg id="spinner" viewBox="0 0 200 200" width="200" height="200">
                    <!-- Anillos de colores -->
                    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gradient1)" stroke-width="8"/>
                    <circle cx="100" cy="100" r="60" fill="none" stroke="url(#gradient2)" stroke-width="6"/>
                    <circle cx="100" cy="100" r="40" fill="none" stroke="url(#gradient3)" stroke-width="4"/>

                    <!-- Puntos visuales para ver el giro -->
                    <circle cx="100" cy="20" r="6" fill="#667eea"/>
                    <circle cx="180" cy="100" r="6" fill="#f093fb"/>
                    <circle cx="100" cy="180" r="6" fill="#4facfe"/>
                    <circle cx="20" cy="100" r="6" fill="#764ba2"/>

                    <!-- Puntos secundarios -->
                    <circle cx="150" cy="50" r="4" fill="rgba(255,255,255,0.8)"/>
                    <circle cx="150" cy="150" r="4" fill="rgba(255,255,255,0.8)"/>
                    <circle cx="50" cy="150" r="4" fill="rgba(255,255,255,0.8)"/>
                    <circle cx="50" cy="50" r="4" fill="rgba(255,255,255,0.8)"/>

                    <!-- Centro -->
                    <circle cx="100" cy="100" r="15" fill="url(#gradientCenter)" stroke="white" stroke-width="2"/>

                    <defs>
                        <linearGradient id="gradient1">
                            <stop offset="0%" stop-color="#667eea"/>
                            <stop offset="100%" stop-color="#764ba2"/>
                        </linearGradient>
                        <linearGradient id="gradient2">
                            <stop offset="0%" stop-color="#f093fb"/>
                            <stop offset="100%" stop-color="#f5576c"/>
                        </linearGradient>
                        <linearGradient id="gradient3">
                            <stop offset="0%" stop-color="#4facfe"/>
                            <stop offset="100%" stop-color="#00f2fe"/>
                        </linearGradient>
                        <radialGradient id="gradientCenter">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#e0e0e0"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>
            <p class="hint">Arrastra el spinner para girarlo - tiene inercia real</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
